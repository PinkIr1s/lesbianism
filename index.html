in vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

precision highp float;
precision highp int;

uniform sampler2D uState;
uniform vec2 driftStep;
uniform float flowStep;
uniform float freeze;
uniform float seedBurst;
uniform float seedEpoch;
uniform vec2 mousePos;
uniform float dragActive;
uniform vec2 clickPos[8];
uniform float clickAge[8];
out vec4 oColor;

const float feed = 0.034;
const float kill = 0.057;
const vec2 simMargin = vec2(1.5, 1.5);
const vec2 simTexel = vec2(0.00104167, 0.00185185);

const float hardEdge = 0.0;
const float simScale = 2.4;

#define screenSize vec2(640.0, 360.0)
const float polar = 0.0;

const float hoverEnable = 1.0;
const float hoverRadius = 35.0;
const float hoverDrawRadius = 5.0;
const float hoverDragOnly = 0.0;

const float clickRadius = 50.0;
const float clickDrawRadius = 5.0;
const float hoverMode = 1.0;
const float clickMode = 0.0;
const float warpType = 0.0;

const float seedRadius = 5.0;
const float seedPitch = 0.0;
const float seedFill = 0.0;

const float flowType = 3.0;

#define TAU 6.28318530718

#define DIFF_V 0.5

#define MAX_CLICKS 8

#define DRAW_U       0.5
#define DRAW_V       0.25
#define DRAW_JITTER  0.05
#define CLICK_LIFE   0.35

vec2 geoUV(vec2 uv) {
    return uv;
}
vec2 geoInv(vec2 uv) {
    return uv;
}
vec2 geoVec(vec2 v) {
    return v;
}

vec2 warpUV(vec2 uv) {
    return uv;
}

vec2 rotateUV(vec2 uv) {
    return uv;
}

float mirror1(float x) { return 1.0 - abs(mod(x, 2.0) - 1.0); }
vec2 simUV(vec2 uv) {
    
    return vec2(mirror1(uv.x), mirror1(uv.y));
}

vec2 zoomUV(vec2 uv) {
    return 0.5 + (uv - 0.5) / (max(simScale, 1.0) * max(simMargin, vec2(1.0)));
}
vec2 simPoint(vec2 p) {
    
    return simUV(rotateUV(geoInv(warpUV(geoUV(zoomUV(p / screenSize)))))) / simTexel;
}

void inject(inout float u, inout float v, float amp) {
    v -= amp * v; u += amp * (1.0 - u);
}

void plant(inout float u, inout float v, float amp, float tv) {
    u -= amp * max(u - DRAW_U, 0.0);
    v += amp * max(tv - v, 0.0);
}

float shash(vec2 p, float k) {
    p = fract(p * vec2(127.1, 311.7) + k * vec2(0.71, 0.37));
    p += dot(p, p.yx + 19.19 + k);
    return fract((p.x + p.y) * 43.32);
}

float drawV(vec2 px) { return DRAW_V + DRAW_JITTER * shash(px + 11.0, seedEpoch); }

#define SEED_PITCH 4.5

#define SEED_FILL 0.55

float spawnMask(vec2 px, float epoch) {
    vec2  org  = vec2(0.0);
    vec2  size = 1.0 / simTexel;
    
    vec2  q    = px - org;                       
    vec2  pic  = screenSize;
    vec2  c    = q - size * 0.5;
    {                       
        float r    = seedRadius > 0.0 ? seedRadius : max(0.035 * pic.y, 4.0);
        float p    = seedPitch  > 0.0 ? seedPitch  : SEED_PITCH;
        vec2  want = seedRadius > 0.0 ? vec2(r * p) : pic / vec2(8.0, 5.0);
        vec2  grid = max(floor(size / want), vec2(1.0));
        vec2  cell = size / grid;
        vec2  g    = floor(q / cell);
        float keep = seedFill > 0.0 ? seedFill : SEED_FILL;
        bool  tile = !(hardEdge > 0.5 && polar < 0.5 && warpType < 0.5);
        for (int dy = -1; dy <= 1; dy++) {
            for (int dx = -1; dx <= 1; dx++) {
                vec2 gc = g + vec2(float(dx), float(dy));

                vec2 gh = gc;
                if (tile) {
                    gh = mod(gc, grid);
                } else if (gc.x < 0.0 || gc.y < 0.0 || gc.x >= grid.x || gc.y >= grid.y) {
                    continue;
                }
                if (shash(gh, epoch) < 1.0 - keep) continue;
                vec2 jc = (gc + vec2(shash(gh + 3.1, epoch), shash(gh + 7.7, epoch))) * cell;
                if (!tile) jc = clamp(jc, vec2(r), size - vec2(r));
                if (length(q - jc) <= r) return 1.0;
            }
        }
        return 0.0;
    }
    vec2 grid = max(floor(size / (pic / vec2(10.0, 6.0))), vec2(1.0));
    vec2 cell = size / grid;                     
    vec2 ctr  = (floor(q / cell) + 0.5) * cell;
    return step(length(q - ctr), max(0.025 * pic.y, 3.0));
}

vec2 wrapT(sampler2D tex, vec2 p) {
    
    return texture(tex, fract(p)).rg;
}

#define FLOW_CELLS  2.0
vec2 flowVec(vec2 uv) {
    float asp = screenSize.x / screenSize.y;
    vec2  c   = (uv - 0.5) * vec2(asp, 1.0);
    vec2  v   = vec2(0.0);
    {                                    
        float k = TAU * FLOW_CELLS;
        v = vec2(sin(k * c.y) * cos(k * c.x), -cos(k * c.y) * sin(k * c.x));
    }
    return v / vec2(asp, 1.0);
}

vec4 shade(sampler2D tex, vec2 tc, vec2 screen_coords) {
    vec2 base = tc + driftStep;
    
    if (flowType > 0.5 && flowStep != 0.0) base += geoVec(flowStep * flowVec(geoUV(tc)));
    vec2  c = wrapT(tex, base);
    float u = c.x, v = c.y;

    if (seedBurst > 0.5) {
        float m = spawnMask(screen_coords, seedEpoch);
        return vec4(mix(u, DRAW_U, m), mix(v, drawV(screen_coords), m), 0.0, 1.0);
    }

    if (freeze < 0.5) {
        vec2 lap = -c;
        lap += 0.20 * wrapT(tex, base + vec2( simTexel.x, 0.0));
        lap += 0.20 * wrapT(tex, base + vec2(-simTexel.x, 0.0));
        lap += 0.20 * wrapT(tex, base + vec2(0.0,  simTexel.y));
        lap += 0.20 * wrapT(tex, base + vec2(0.0, -simTexel.y));
        lap += 0.05 * wrapT(tex, base + simTexel);
        lap += 0.05 * wrapT(tex, base - simTexel);
        lap += 0.05 * wrapT(tex, base + vec2( simTexel.x, -simTexel.y));
        lap += 0.05 * wrapT(tex, base + vec2(-simTexel.x,  simTexel.y));

        float F = feed, K = kill;
        
        float uvv = u * v * v;
        u = u + (lap.x - uvv + F * (1.0 - u));
        v = v + (DIFF_V * lap.y + uvv - (F + K) * v);

    }

    float hgate = hoverEnable * ((hoverDragOnly > 0.5) ? dragActive : 1.0);

    if (hgate > 0.5) {
        float hr = (hoverMode > 0.5) ? hoverDrawRadius : hoverRadius;
        float rr = max(hr, 1.0);
        float d  = length(screen_coords - simPoint(mousePos));
        { plant(u, v, step(d, rr), drawV(screen_coords)); }
    }
    {
        float cr = (clickMode > 0.5) ? clickDrawRadius : clickRadius;
        float rr = max(cr, 1.0);
        for (int i = 0; i < MAX_CLICKS; i++) {
            float life = clickAge[i] / CLICK_LIFE;
            if (life >= 1.0) continue;
            float d = length(screen_coords - simPoint(clickPos[i]));
            {
                inject(u, v, (1.0 - smoothstep(0.0, rr, d)) * (1.0 - life));
            }
        }
    }

    return vec4(clamp(u, 0.0, 1.0), clamp(v, 0.0, 1.0), 0.0, 1.0);
}


void main(){
  vec2 sim = vec2(960.0, 540.0);
  vec2 uv = gl_FragCoord.xy / sim;
  oColor = shade(uState, uv, gl_FragCoord.xy);
}`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error("Shader compile error:\n" + gl.getShaderInfoLog(sh));

    gl.linkProgram(p);

    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const CW = 640, CH = 360;
  const STEPS = 6, WARMUP = 60;

  // exactly how the app degrades when the GPU has no float canvas (tiny per-step updates
  // quantise away, so the reaction looks coarser but still runs).
  const flt = gl.getExtension("EXT_color_buffer_float");
  if (!flt) console.warn("no EXT_color_buffer_float - falling back to 8-bit, reaction will be coarse");
  const IFMT = flt ? gl.RGBA16F : gl.RGBA8, TYPE = flt ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  function target() {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, IFMT, SW, SH, 0, gl.RGBA, TYPE, null);
    // the sim is a torus: the step wraps every read, so repeat-wrap lets linear filtering
    // interpolate across the seam instead of clamping at it
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex: tex, fbo: fbo };
  }
  let src = target(), dst = target();

  // null-safe: a uniform the minimizer folded out has no location
  function U(prog, n) { return gl.getUniformLocation(prog, n); }
  function f1(l, v) { if (l) gl.uniform1f(l, v); }
  function f2(l, a, b) { if (l) gl.uniform2f(l, a, b); }
  function fv(l, a) { if (l) gl.uniform1fv(l, a); }
  function v2v(l, a) { if (l) gl.uniform2fv(l, a); }

  const sU = {};
  sU.driftStep = U(stepProg, "driftStep");
  sU.flowStep = U(stepProg, "flowStep");
  sU.freeze = U(stepProg, "freeze");
  sU.seedBurst = U(stepProg, "seedBurst");
  sU.seedEpoch = U(stepProg, "seedEpoch");
  sU.mousePos = U(stepProg, "mousePos");
  sU.dragActive = U(stepProg, "dragActive");
  sU.clickPos = U(stepProg, "clickPos");
  sU.clickAge = U(stepProg, "clickAge");
  sU.state = U(stepProg, "uState");
  const dU = {};
  dU.state = U(dispProg, "uState");

  let warpPhase = 0, mixPhase = 0;
  const NC = 8;
  const clickPos = new Float32Array(NC * 2).fill(-9999);
  const clickAge = new Float32Array(NC).fill(1e6);
  let clickSlot = 0;
  let mx = -9999, my = -9999, dragOn = 0;

  // one step: read src, write dst, swap
  function step(seed, freeze, drift, flow) {
    gl.useProgram(stepProg);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, SW, SH);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    if (sU.state) gl.uniform1i(sU.state, 0);
    f1(sU.seedBurst, seed); f1(sU.freeze, freeze);
    f1(sU.warpPhase, warpPhase); f1(sU.mixPhase, mixPhase);
    f2(sU.driftStep, drift[0], drift[1]); f1(sU.flowStep, flow);
    f1(sU.seedEpoch, SEED_EPOCH);
    f2(sU.mousePos, mx, my); f1(sU.dragActive, dragOn);
    v2v(sU.clickPos, clickPos); fv(sU.clickAge, clickAge);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const t = src; src = dst; dst = t;
  }

  function display() {
    gl.useProgram(dispProg);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    if (dU.state) gl.uniform1i(dU.state, 0);
    f1(dU.warpPhase, warpPhase);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // seed: an empty substrate (u = 1, v = 0), then ONE frozen burst pass - all the SPAWN
  // geometry lives in the step shader - then the warm-up, so structure shows immediately
  gl.bindFramebuffer(gl.FRAMEBUFFER, src.fbo);
  gl.viewport(0, 0, SW, SH);
  gl.clearColor(1, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  step(1, 1, [0, 0], 0);
  for (let i = 0; i < WARMUP; i++) step(0, 0, [0, 0], 0);
  display();

  function setMouse(e) {
    mx = e.clientX / window.innerWidth * CW;
    my = e.clientY / window.innerHeight * CH;
  }
  window.addEventListener("pointermove", setMouse);
  window.addEventListener("pointerdown", function (e) { setMouse(e); dragOn = 1;
    clickPos[clickSlot * 2] = mx; clickPos[clickSlot * 2 + 1] = my;
    clickAge[clickSlot] = 0; clickSlot = (clickSlot + 1) % NC;
  });
  window.addEventListener("pointerup", function () { dragOn = 0; });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    warpPhase += dt * WARP_SPEED; mixPhase += dt * MIX_MORPH;
    for (let i = 0; i < NC; i++) clickAge[i] = Math.min(clickAge[i] + dt, 1e6);
    const n = STEPS;
    const drift = (WALLED || n <= 0) ? [0, 0] : [SCROLL_X * dt / n, SCROLL_Y * dt / n];
    const flow = (!FLOW_ON || n <= 0) ? 0 : FLOW_RATE * dt / n;
    for (let i = 0; i < n; i++) step(0, 0, drift, flow);
    if (n <= 0) step(0, 1, [0, 0], 0);   // SPEED 0: a frozen pass, so cursor edits still land
    display();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
